name: Development checks

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: npm ci
      - run: npm run check
      - name: Validate xSync release packaging
        run: npm run package:plugin
      - name: Prepare isolated Docker database and generated test vaults
        run: npm run desktop:setup
      - name: Go vet
        working-directory: server
        run: go vet ./...
      - name: Require browser for native IndexedDB crash tests
        run: |
          chrome_binary="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_binary" ]; then
            echo "Chrome/Chromium is required for the native IndexedDB suite."
            exit 1
          fi
          echo "OBSIDIAN_SYNC_CHROME=$chrome_binary" >> "$GITHUB_ENV"
      - name: PostgreSQL contracts, race detector, recovery and native IndexedDB
        run: npm run test:desktop
      - name: Stop this project's development database
        if: always()
        run: docker compose -f server/compose.dev.yaml stop
  server-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build server image without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          load: true
          tags: xsync-server:ci
          cache-from: type=gha,scope=xsync-server-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=xsync-server-${{ matrix.architecture }}
      - name: Smoke test the container entrypoint
        run: |
          docker run --rm --platform linux/${{ matrix.architecture }} xsync-server:ci --help
          test "$(docker image inspect xsync-server:ci --format '{{.Config.User}}')" = '65532:65532'
