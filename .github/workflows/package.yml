name: Prepare xSync package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:plugin
      - uses: actions/upload-artifact@v4
        with:
          name: xsync-package
          path: dist/release/
          if-no-files-found: error
