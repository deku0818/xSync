name: obsidiansync-dev
services:
  postgres:
    image: postgres:17.11-alpine
    env_file:
      - ../.local/desktop/postgres.env
    ports:
      - "127.0.0.1:55438:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncdev -d obsidiansync"]
      interval: 2s
      timeout: 3s
      retries: 30
    labels:
      com.obsidiansync.purpose: desktop-development-only
volumes:
  postgres-data:
